name: Pelmet
options:
  bundleIdPrefix: app.fif7y
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  PelmetCore:
    path: Packages/PelmetCore
  PelmetEngine:
    path: Packages/PelmetEngine
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0
schemes:
  Pelmet:
    build:
      targets:
        Pelmet: all
    test:
      targets:
        - PelmetTests
targets:
  Pelmet:
    type: application
    platform: macOS
    sources:
      - Pelmet
    dependencies:
      - package: PelmetCore
      - package: PelmetEngine
        product: PelmetEngine
      - package: Sparkle
        product: Sparkle
    info:
      path: Pelmet/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Gabriel Faucon"
        SUFeedURL: https://fif7y.github.io/pelmet/appcast.xml
        SUPublicEDKey: HyfGTw9yRC/C2CUxxamEhzxZuK+WWuG7WPI6F+BUOgE=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fif7y.Pelmet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
  PelmetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PelmetTests
    dependencies:
      - target: Pelmet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YW9UY68SQ7
