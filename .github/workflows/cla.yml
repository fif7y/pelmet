name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/fif7y/pelmet/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'fif7y,dependabot[bot]'
          custom-notsigned-prcomment: 'Thanks for the pull request! Pelmet asks contributors to sign a short Contributor License Agreement (you keep your copyright, see [CLA.md](https://github.com/fif7y/pelmet/blob/main/CLA.md)). Please post the sentence below as a comment to sign it.'
