name: Bug report
description: Something in Pelmet misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Pelmet and macOS versions
      placeholder: "Pelmet 0.2.4 · macOS 27.0 (25A000)"
    validations:
      required: true
  - type: dropdown
    id: displays
    attributes:
      label: Display setup
      options:
        - Built-in display only
        - External display(s)
        - Mixed, built-in plus external
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "Pelmet writes a log you can attach: `~/Library/Logs/Pelmet/pelmet.log`. Paste the relevant part or drop the file here."
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording (optional)
