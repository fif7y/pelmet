<!doctype html>
<meta charset="utf-8">
<title>Pelmet menu bar mock — marketing compositor</title>
<style>
  html,body{margin:0;padding:0;background:#111}
  #stage{position:relative;width:1150px;height:80px;overflow:hidden}
  #bg{position:absolute;left:0;top:0;width:1150px;height:80px}
  .glyph{position:absolute;top:50%;transform:translate(-50%,-50%)}
  .glyph img{display:block;filter:drop-shadow(0 0 0 transparent)}
  .pipe{position:absolute;top:50%;transform:translate(-50%,-50%);width:3px;height:30px;
    border-radius:2px;background:rgba(255,255,255,.85)}
</style>
<div id="stage">
  <img id="bg" src="bar-base.png">
  <div id="row"></div>
</div>
<script>
/* ================= EDIT ME =================
   The revealed "hidden section", drawn left of the system cluster.
   {glyph:'glyphs/x.svg', size?:36}  white template glyph (Simple Icons etc.)
   {icon:'icons/x.png',  size?:34}   fallback: colored app icon (less native)
   {sep:true}                        pipe separator                            */
const ITEMS = [
  {glyph:'glyphs/spotify.svg'},
  {glyph:'glyphs/1password.svg'},
  {sep:true},
  {glyph:'glyphs/raycast.svg'},
  {glyph:'glyphs/dropbox.svg'},
  {glyph:'glyphs/docker.svg'},
];
/* =========== END EDIT ME =========== */

// bar-base.png geometry (@2x): hidden items end just left of the first
// always-visible icon. Match the real bar: 64px pitch, ~36px glyphs.
const END_X = 530, PITCH = 64, SIZE = 36;

window.ready = new Promise(res => {
  const row = document.getElementById('row');
  let x = END_X - PITCH/2;
  for (let i = ITEMS.length - 1; i >= 0; i--) {
    const it = ITEMS[i];
    let el;
    if (it.sep) {
      el = document.createElement('div');
      el.className = 'pipe';
      el.style.left = x + 'px';
    } else {
      el = document.createElement('div');
      el.className = 'glyph';
      el.style.left = x + 'px';
      const s = it.size || (it.icon ? 34 : SIZE);
      el.innerHTML = `<img src="${it.glyph || it.icon}" width="${s}" height="${s}">`;
    }
    row.appendChild(el);
    x -= PITCH;
  }
  res(true);
});
</script>
